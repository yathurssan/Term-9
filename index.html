const ST=["2026-11-02","2026-11-09","2026-11-16","2026-11-23","2026-11-30","2026-12-07","2027-01-04","2027-01-11","2027-01-18","2027-01-25"];
const DN=["Mon","Tue","Wed","Thu","Fri"],MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SUB={P:["Pathology","#e11d48"],S:["Surgery","#2563eb"],M:["Microbiology","#16a34a"],Pd:["Paediatrics","#d97706"],C:["CPT","#7c3aed"],F:["Forensic","#64748b"],D:["DCFM","#0891b2"],Pa:["Parasitology","#c026d3"],O:["","#94a3b8"]};
const I=[1,3,7,14,30,60];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const add=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const today=()=>ymd(new Date());
const fd=s=>{const d=new Date(s+"T00:00:00");return d.getDate()+" "+MO[d.getMonth()]};
const tm=t=>{const a=t.split("-");return a[0]+"–"+(+a[a.length-1]+1)+"pm"};
let w=-1,fc=0;const items=[],K={};
RAW.split("\n").forEach(l=>{if(!l)return;if(l[0]=="#"){w++;return}const[d,t,sj,x,doc]=l.split("|");if(sj=="O")return;
let n=x.indexOf("CBL")==0?"CBL: CVS & RS":x.replace(/\s*Gr\.? ?[\d&]+.*$/,"");
if(sj=="F")n="Forensic Medicine – lecture "+(++fc);
const k=sj+n;if(!K[k]){K[k]={id:"t"+items.length,s:sj,x:n,docs:[],dates:[]};items.push(K[k])}
const o=K[k],dt=add(ST[w],+d);if(doc&&o.docs.indexOf(doc)<0)o.docs.push(doc);if(o.dates.indexOf(dt)<0)o.dates.push(dt)});
let S={};try{S=JSON.parse(localStorage.getItem("term9")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("term9",JSON.stringify(S))}catch(e){}};
let cur=0,sb="P",fl=0;
function act(a,id){const t=today(),r=S[id];
if(a=="s")S[id]={n:0,due:add(t,1)};
else if(a=="u")delete S[id];
else if(a=="r"){r.n++;if(r.n>=6){r.m=1;delete r.due}else r.due=add(t,I[r.n])}
else if(a=="f"){r.n=0;delete r.m;r.due=add(t,1)}
save();draw()}
function stat(id){const r=S[id];if(!r)return"";if(r.m)return"🏆 Mastered";const k=diff(today(),r.due);return"Reviews done "+r.n+"/6 · next "+(k<=0?"<b>due now</b>":k==1?"tomorrow":"in "+k+" days ("+fd(r.due)+")")}
function card(i,rv){const c=SUB[i.s][1],r=S[i.id];
let h='<div class="it'+(r&&r.m?" mast":"")+'" style="--c:'+c+'"><div class="top"><span class="tag">'+SUB[i.s][0]+'</span><span>'+i.dates.map(fd).join(" · ")+'</span></div><div class="tp">'+i.x+'</div>'+(i.docs.length?'<div class="dr">'+i.docs.join(", ")+'</div>':"")+'<div class="row">';
if(rv)h+='<button class="ok" onclick="act(\'r\',\''+i.id+'\')">Reviewed</button><button class="no" onclick="act(\'f\',\''+i.id+'\')">Forgot</button><span class="st">'+stat(i.id)+'</span>';
else if(!r)h+='<button onclick="act(\'s\',\''+i.id+'\')">Mark studied</button>';
else h+='<span class="st">✅ '+stat(i.id)+'</span><button class="g" onclick="act(\'u\',\''+i.id+'\')">Undo</button>';
return h+'</div></div>'}
function draw(){const t=today(),T=items;
const due=T.filter(i=>S[i.id]&&!S[i.id].m&&S[i.id].due<=t).sort((a,b)=>S[a.id].due<S[b.id].due?-1:1);
document.getElementById("bd").innerHTML=due.length?'<span class="bd">'+due.length+'</span>':"";
[0,1,2].forEach(k=>document.getElementById("n"+k).className=k==cur?"on":"");
let h="";
if(cur==0){const ks=Object.keys(SUB).filter(k=>k!="O"),L=T.filter(i=>i.s==sb),dn=L.filter(i=>S[i.id]).length;
h='<div class="chips">'+ks.map(k=>'<button class="chip'+(k==sb?" on":"")+'" onclick="sb=\''+k+'\';draw()">'+SUB[k][0]+' '+T.filter(i=>i.s==k&&S[i.id]).length+'/'+T.filter(i=>i.s==k).length+'</button>').join("")+'</div>';
h+='<div class="chips" style="padding-top:0">'+["All","To study","Studied"].map((n,k)=>'<button class="chip'+(k==fl?" on":"")+'" onclick="fl='+k+';draw()">'+n+'</button>').join("")+'</div>';
h+='<div class="pg" style="margin:4px 16px 8px"><b style="color:'+SUB[sb][1]+'">'+SUB[sb][0]+'</b> <span class="st">'+dn+'/'+L.length+' topics studied</span><div class="bar"><i style="width:'+(dn/L.length*100)+'%;background:'+SUB[sb][1]+'"></i></div></div>';
const F=L.filter(i=>fl==0||(fl==1)==!S[i.id]);
h+=F.length?'<div class="day">'+F.map(i=>card(i,0)).join("")+'</div>':'<div class="empty">No topics here.</div>'}
else if(cur==1){h='<h2>Due for review ('+due.length+')</h2>';
h+=due.length?"<div class='day'>"+due.map(i=>card(i,1)).join("")+"</div>":'<div class="empty">Nothing due. 🎉<br>Mark topics as studied in the Subjects tab.</div>';
const up=T.filter(i=>S[i.id]&&!S[i.id].m&&S[i.id].due>t).sort((a,b)=>S[a.id].due<S[b.id].due?-1:1);
if(up.length)h+='<h2>Upcoming ('+up.length+')</h2><div class="day">'+up.map(i=>card(i,1).replace(/<button class="ok".*?<\/button>/,"")).join("")+'</div>'}
else{const st=T.filter(i=>S[i.id]).length,m=T.filter(i=>S[i.id]&&S[i.id].m).length,p=Math.round(st/T.length*100);
h='<div class="grid"><div class="pg"><div class="big">'+st+'/'+T.length+'</div>topics studied<div class="bar"><i style="width:'+p+'%"></i></div></div><div class="pg"><div class="big">'+m+'</div>mastered 🏆</div><div class="pg"><div class="big">'+due.length+'</div>due now</div><div class="pg"><div class="big">'+(st-m)+'</div>in review cycle</div></div><h2>By subject</h2>';
for(const k in SUB){if(k=="O")continue;const a=T.filter(i=>i.s==k),b=a.filter(i=>S[i.id]).length;h+='<div class="pg" style="margin:8px 16px"><b style="color:'+SUB[k][1]+'">'+SUB[k][0]+'</b> <span class="st">'+b+'/'+a.length+'</span><div class="bar"><i style="width:'+(b/a.length*100)+'%;background:'+SUB[k][1]+'"></i></div></div>'}
h+='<div class="sub" style="padding:12px 16px">Review gaps: 1 · 3 · 7 · 14 · 30 · 60 days. Progress is saved on this device.</div>'}
document.getElementById("v").innerHTML=h}
function tab(k){cur=k;draw();scrollTo(0,0)}
draw();
